general {
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Turn off the display after five minutes idle; restore it on activity.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# At ten minutes idle, watch power state: suspend immediately on battery,
# or at thirty minutes total idle while connected to AC power.
listener {
    timeout = 600
    on-timeout = bash /home/bassel/.config/hypr/scripts/idle-suspend-watch.sh start
    on-resume = bash /home/bassel/.config/hypr/scripts/idle-suspend-watch.sh cancel
}
